<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Sid Jashnani</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --paper:#000; --ink:#E8E8E8; --soft:#8F8F8F; --rule:#232323; --accent:#fff; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,monospace;
    display:grid; place-items:center; padding:8vw 6vw; text-align:center;
  }
  .wrap { max-width:46ch; display:grid; gap:22px; justify-items:center; }
  canvas { width:150px; height:150px; }
  h1 { font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-weight:800;
       font-size:clamp(34px,7vw,62px); letter-spacing:-0.04em; line-height:1; margin:0; }
  p { color:var(--soft); font-size:13px; letter-spacing:.06em; line-height:1.8; margin:0; }
  .lbl { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--soft); }
  a.btn {
    font-size:11.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    text-decoration:none; background:var(--accent); color:var(--paper);
    padding:14px 24px; border-radius:999px; margin-top:6px;
  }
</style>
</head>
<body>
  <main class="wrap">
    <canvas id="art" width="300" height="300" role="img" aria-label="A grid of dots with one missing"></canvas>
    <span class="lbl">Error 404</span>
    <h1>One dot missing.</h1>
    <p>This page isn't here. Everything else is where you left it.</p>
    <a class="btn" href="/">Back to sidjashnani.com</a>
  </main>
<script>
  var c = document.getElementById('art'), x = c.getContext('2d'), n = 10, g = 300 / n;
  var gone = 43;
  for (var i = 0; i < n * n; i++) {
    var cx = g * ((i % n) + 0.5), cy = g * (Math.floor(i / n) + 0.5);
    x.beginPath(); x.arc(cx, cy, 6, 0, 6.2832);
    if (i === gone) { x.strokeStyle = '#3a3a3a'; x.lineWidth = 2; x.stroke(); }
    else { x.fillStyle = '#E8E8E8'; x.fill(); }
  }
</script>
</body>
</html>
